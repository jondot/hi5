# hi5 is a Rust workspace: the domain logic lives in `hi5-core` and knows
# nothing about any UI framework, and `hi5-gpui` is the application shell
# built on GPUI.
#
# `hi5-core` was first written for a Tauri + React shell, since retired;
# it moved across unchanged, because none of it ever knew what was
# drawing the panel.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/jondot/hi5"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
